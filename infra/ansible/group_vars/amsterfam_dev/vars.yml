---
# Non-secret indirection onto the vault-encrypted values in vault.yml, so
# `git diff` on this file stays readable even though the underlying secrets
# are encrypted. See vault.yml.example for the full list of vault_* keys.
authentik_secret_key: "{{ vault_authentik_secret_key }}"
authentik_bootstrap_token: "{{ vault_authentik_bootstrap_token }}"
authentik_bootstrap_email: "{{ vault_authentik_bootstrap_email }}"
authentik_bootstrap_password: "{{ vault_authentik_bootstrap_password }}"

postgres_password: "{{ vault_postgres_password }}"
authentik_db_password: "{{ vault_authentik_db_password }}"

acme_email: "{{ vault_acme_email }}"

deploy_ssh_public_key: "{{ vault_deploy_ssh_public_key }}"

# Optional: web push stays off until these are in the vault.
push_vapid_public_key: "{{ vault_push_vapid_public_key | default('') }}"
push_vapid_private_key: "{{ vault_push_vapid_private_key | default('') }}"
push_subject: "{{ vault_push_subject | default('') }}"

# Optional: news by email stays off until vault_smtp_host is in the vault.
smtp_host: "{{ vault_smtp_host | default('') }}"
smtp_port: "{{ vault_smtp_port | default(587) }}"
smtp_username: "{{ vault_smtp_username | default('') }}"
smtp_password: "{{ vault_smtp_password | default('') }}"
smtp_from: "{{ vault_smtp_from | default('') }}"
smtp_starttls: "{{ vault_smtp_starttls | default(true) }}"
