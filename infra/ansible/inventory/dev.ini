[amsterfam_dev]
dev.amsterfam.eu

[amsterfam_dev:vars]
# Default connection user for day-to-day runs (deploy.yml, CI). The very first
# site.yml run against a brand-new host has no `deploy` user yet — pass
# -e bootstrap_user=root (or whatever initial account the host provides) to
# override this for that one run. See infra/ansible/README.md.
ansible_user={{ bootstrap_user | default('deploy') }}
