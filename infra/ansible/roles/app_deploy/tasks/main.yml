---
- name: Ensure git is installed
  ansible.builtin.apt:
    name: git
    state: present
  become: true

- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  become: true

- name: Check for an existing deploy SSH keypair
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/.ssh/id_ed25519"
  register: deploy_key_stat
  become: true
  become_user: "{{ deploy_user }}"

- name: Generate a deploy SSH keypair for cloning the repo
  community.crypto.openssh_keypair:
    path: "/home/{{ deploy_user }}/.ssh/id_ed25519"
    type: ed25519
    comment: "{{ deploy_user }}@{{ inventory_hostname }}"
  become: true
  become_user: "{{ deploy_user }}"
  when: not deploy_key_stat.stat.exists
  register: generated_deploy_key

# The clone below will fail until this key is authorized — that's expected
# and intentional on a first run.
- name: Pause for the deploy key to be added to GitHub
  ansible.builtin.pause:
    prompt: |
      A new deploy key was generated. Add its public half as a read-only
      deploy key on the GitHub repo (Settings -> Deploy keys), then press
      Enter to continue:
      {{ generated_deploy_key.public_key }}
  when: generated_deploy_key is defined and generated_deploy_key is changed

- name: Clone or update the repo
  ansible.builtin.git:
    repo: "{{ git_repo_url }}"
    dest: "{{ deploy_dir }}"
    version: "{{ git_repo_ref }}"
    accept_hostkey: true
    key_file: "/home/{{ deploy_user }}/.ssh/id_ed25519"
  become: true
  become_user: "{{ deploy_user }}"

- name: Template production .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_dir }}/infra/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  become: true
  become_user: "{{ deploy_user }}"

- name: Build images
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_dir }}/infra"
    files:
      - docker-compose.yml
      - docker-compose.prod.yml
    profiles: [full]
    build: always
    state: present
  become: true
  become_user: "{{ deploy_user }}"

- name: Bring the stack up
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_dir }}/infra"
    files:
      - docker-compose.yml
      - docker-compose.prod.yml
    profiles: [full]
    state: present
    pull: missing
  become: true
  become_user: "{{ deploy_user }}"
