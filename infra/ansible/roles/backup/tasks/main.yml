---
- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"
  become: true

- name: Install backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ deploy_dir }}/backup.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"
  become: true

- name: Schedule nightly backup cron job
  ansible.builtin.cron:
    name: amsterfam-db-backup
    user: "{{ deploy_user }}"
    minute: "17"
    hour: "3"
    job: "{{ deploy_dir }}/backup.sh >> {{ backup_dir }}/backup.log 2>&1"
  become: true
