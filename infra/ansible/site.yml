---
# Full host bring-up. On a brand-new box, run once with:
#   ansible-playbook site.yml -e bootstrap_user=root --ask-vault-pass
# (or whatever initial account the host provides) — deploy_user doesn't exist
# yet, so the default ansible_user=deploy in inventory/dev.ini won't connect.
# Subsequent runs use the default deploy user.
- name: Bring up dev.amsterfam.eu
  hosts: amsterfam_dev
  become: true
  roles:
    - deploy_user
    - base
    - role: geerlingguy.docker
      vars:
        docker_users: ["{{ deploy_user }}"]
    - traefik
    - app_deploy
    - backup
