server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker's update check hinges on always seeing a fresh copy
    # of these two files — a stale cached one anywhere in between (browser,
    # proxy) means "up to date" gets decided from old data.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
