server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are routed same-origin (see /api/v1/me in ngsw-config.json and
    # environment.docker.ts's relative apiAddress) — but by Traefik, not here.
    # This container only ever serves static files; routing "/api" to the
    # backend is Traefik's job (see infra/docker-compose.prod.yml labels).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
