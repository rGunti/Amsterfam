<mat-card class="offline-card">
  <mat-card-content>
    <mat-icon class="offline-icon">wifi_off</mat-icon>
    <h2>You're offline</h2>
    <p>Amsterfam can't reach the network right now. Some pages may not be available.</p>
    <button mat-raised-button color="primary" (click)="reload()">
      <mat-icon>refresh</mat-icon>
      Try again
    </button>
  </mat-card-content>
</mat-card>
