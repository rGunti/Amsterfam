@if (loading()) {
  <p>Loading…</p>
} @else if (events().length === 0) {
  <p class="empty">You're not part of any trips yet.</p>
} @else {
  <div class="events-grid">
    @for (event of events(); track event.id) {
      <mat-card class="event-card" [routerLink]="['/events', event.id]">
        <mat-card-header>
          <mat-card-title>{{ event.name }}</mat-card-title>
          <mat-card-subtitle>
            <mat-icon inline>place</mat-icon> {{ event.location }}
          </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p class="dates">
            <mat-icon inline>event</mat-icon>
            {{ event.startDate }} – {{ event.endDate }}
          </p>
          <mat-chip-set>
            <mat-chip [class]="'status-' + event.status.toLowerCase()">{{ event.status }}</mat-chip>
          </mat-chip-set>
        </mat-card-content>
      </mat-card>
    }
  </div>
}
