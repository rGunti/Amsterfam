<mat-card class="status-card">
  <mat-card-content>
    <mat-icon class="status-page-icon">{{ data.icon }}</mat-icon>
    <h2>{{ data.title }}</h2>
    <p>{{ data.message }}</p>
    <a mat-flat-button color="primary" routerLink="/">
      <mat-icon>arrow_back</mat-icon>
      Back to events
    </a>
  </mat-card-content>
</mat-card>
