name: Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  # Lets a build+push be run manually from any branch (e.g. to test a deploy
  # before merging) via the Actions tab's "Run workflow" button.
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore
        working-directory: backend/Amsterfam

      - name: Restore
        run: dotnet restore -p:HUSKY=0
        working-directory: backend/Amsterfam

      - name: Check formatting
        run: dotnet tool run csharpier check .
        working-directory: backend/Amsterfam

      - name: Build
        run: dotnet build -c Release --no-restore -p:HUSKY=0
        working-directory: backend/Amsterfam

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal --logger "trx;LogFileName=results.trx"
        working-directory: backend/Amsterfam

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: backend/Amsterfam/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: version
        run: |
          dotnet tool install --global nbgv
          version=$(nbgv get-version -v SimpleVersion)
          sha=$(nbgv get-version -v GitCommitIdShort)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend/Amsterfam
          push: true
          build-args: |
            SOURCE_REVISION_ID=${{ steps.version.outputs.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/amsterfam-backend:latest
            ghcr.io/${{ steps.version.outputs.owner }}/amsterfam-backend:${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
