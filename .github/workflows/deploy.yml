name: Deploy

on:
  # Triggers once per completed Backend/Frontend run on main — a PR touching
  # only one of them still redeploys, which is fine since app_deploy is
  # idempotent (git pull + compose pull/up is a no-op if nothing changed).
  workflow_run:
    workflows: ["Backend", "Frontend"]
    branches: [main]
    types: [completed]
  # Lets a deploy be triggered manually for any branch via the Actions tab's
  # "Run workflow" button (e.g. to test this branch before merging) — the
  # images for that branch's commit must already have been pushed to GHCR
  # (run Backend/Frontend's workflow_dispatch first), unless overridden below.
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: "Backend image tag to deploy (blank = this ref's computed tag)"
        required: false
        type: string
      frontend_image_tag:
        description: "Frontend image tag to deploy (blank = this ref's computed tag)"
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to dev.amsterfam.eu
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      # Pinned to the exact commit the successful Backend/Frontend run built —
      # not just "main" — so a push landing between that build finishing and
      # this deploy running can't cause a code/image mismatch. On a manual
      # dispatch there's no workflow_run event, so this falls back to
      # whichever ref/branch was picked in the "Run workflow" dropdown.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: version
        run: |
          dotnet tool install --global nbgv
          version=$(nbgv get-version -v SimpleVersion)
          sha=$(nbgv get-version -v GitCommitIdShort)
          echo "tag=${version}-${sha}" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Install Galaxy roles
        run: ansible-galaxy install -r infra/ansible/requirements.yml

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Deploy fires once per completed Backend/Frontend run, but each of
      # those only builds+pushes an image when its own path filter matched —
      # a frontend-only commit never gets a backend image at this tag (and
      # never will). Only pass the tag for whichever side actually just
      # rebuilt; the target host fills in the other from whatever it's
      # already running (see clone.yml's docker_container_info lookup) —
      # no guessing required, since that's the ground truth. A manual run
      # can override either tag explicitly via the "Run workflow" inputs.
      - name: Determine which image tag(s) to pin
        id: pins
        run: |
          tag="${{ steps.version.outputs.tag }}"
          trigger="${{ github.event.workflow_run.name }}"
          extra_vars="git_repo_ref=${{ github.event.workflow_run.head_sha || github.sha }}"

          backend_override="${{ github.event.inputs.backend_image_tag }}"
          frontend_override="${{ github.event.inputs.frontend_image_tag }}"

          if [ -n "$backend_override" ]; then
            extra_vars="$extra_vars backend_image_tag=$backend_override"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$trigger" = "Backend" ]; then
            extra_vars="$extra_vars backend_image_tag=$tag"
          fi

          if [ -n "$frontend_override" ]; then
            extra_vars="$extra_vars frontend_image_tag=$frontend_override"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$trigger" = "Frontend" ]; then
            extra_vars="$extra_vars frontend_image_tag=$tag"
          fi

          echo "extra_vars=$extra_vars" >> "$GITHUB_OUTPUT"

      - name: Run deploy playbook
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: |
            set -e
            cd infra/ansible
            echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
            trap 'rm -f /tmp/vault_pass' EXIT
            ansible-playbook deploy.yml \
              --private-key ~/.ssh/deploy_key \
              --vault-password-file /tmp/vault_pass \
              --extra-vars "${{ steps.pins.outputs.extra_vars }}"
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
