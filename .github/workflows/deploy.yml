name: Deploy

on:
  # Triggers once per completed Backend/Frontend run on main — a PR touching
  # only one of them still redeploys, which is fine since app_deploy is
  # idempotent (git pull + compose pull/up is a no-op if nothing changed).
  workflow_run:
    workflows: ["Backend", "Frontend"]
    branches: [main]
    types: [completed]
  # Lets a deploy be triggered manually for any branch via the Actions tab's
  # "Run workflow" button (e.g. to test this branch before merging) — the
  # images for that branch's commit must already have been pushed to GHCR
  # (run Backend/Frontend's workflow_dispatch first).
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to dev.amsterfam.eu
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      # Pinned to the exact commit the successful Backend/Frontend run built —
      # not just "main" — so a push landing between that build finishing and
      # this deploy running can't cause a code/image mismatch. On a manual
      # dispatch there's no workflow_run event, so this falls back to
      # whichever ref/branch was picked in the "Run workflow" dropdown.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: version
        run: |
          dotnet tool install --global nbgv
          version=$(nbgv get-version -v SimpleVersion)
          sha=$(nbgv get-version -v GitCommitIdShort)
          echo "tag=${version}-${sha}" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Install Galaxy roles
        run: ansible-galaxy install -r infra/ansible/requirements.yml

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Deploy fires once per completed Backend/Frontend run, but each of
      # those only builds+pushes an image when its own path filter matched —
      # a frontend-only commit never gets a backend image at this tag (and
      # never will). For each side: wait briefly in case it's genuinely still
      # pushing (a real race between the two finishing), then fall back to
      # ":latest" (which always exists and is exactly what that side is
      # already running) rather than failing the whole deploy over a service
      # that was never supposed to change here.
      - name: Resolve image tags
        id: images
        timeout-minutes: 6
        run: |
          set -e
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ steps.version.outputs.tag }}"
          for svc in backend frontend; do
            image="ghcr.io/$owner/amsterfam-$svc"
            resolved=latest
            for i in $(seq 1 24); do
              if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
                resolved="$tag"
                break
              fi
              sleep 5
            done
            echo "$svc: using tag '$resolved'"
            echo "${svc}_tag=$resolved" >> "$GITHUB_OUTPUT"
          done

      - name: Run deploy playbook
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: |
            set -e
            cd infra/ansible
            echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
            trap 'rm -f /tmp/vault_pass' EXIT
            ansible-playbook deploy.yml \
              --private-key ~/.ssh/deploy_key \
              --vault-password-file /tmp/vault_pass \
              --extra-vars "git_repo_ref=${{ github.event.workflow_run.head_sha || github.sha }} backend_image_tag=${{ steps.images.outputs.backend_tag }} frontend_image_tag=${{ steps.images.outputs.frontend_tag }}"
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
