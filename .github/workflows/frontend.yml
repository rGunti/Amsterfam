name: Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  # Lets a build+push be run manually from any branch (e.g. to test a deploy
  # before merging) via the Actions tab's "Run workflow" button.
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check formatting
        run: pnpm exec prettier --check .
        working-directory: frontend

      - name: Lint
        run: pnpm run lint
        working-directory: frontend

      - name: Build
        run: pnpm run build
        working-directory: frontend

      - name: Test
        run: pnpm run test
        working-directory: frontend

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: version
        run: |
          dotnet tool install --global nbgv
          version=$(nbgv get-version -v SimpleVersion)
          sha=$(nbgv get-version -v GitCommitIdShort)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            GIT_SHA=${{ steps.version.outputs.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/amsterfam-frontend:latest
            ghcr.io/${{ steps.version.outputs.owner }}/amsterfam-frontend:${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
